<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600">
  <title>AO Quill</title>
  <defs>
    <path id="nib" d="M -70 -85 C -70 -20 -39 65 0 142 C 39 65 70 -20 70 -85 Z"/>
    <clipPath id="rh"><rect x="0" y="-200" width="200" height="400"/></clipPath>
    <!-- A page card: header bar, image block, text lines; drawn at 0,0, 230 x 300 -->
    <g id="card">
      <rect x="10" y="12" width="230" height="300" rx="22" fill="#1E2A4A" opacity="0.12"/>
      <rect width="230" height="300" rx="22" fill="#1E2A4A"/>
      <rect x="10" y="10" width="210" height="280" rx="16" fill="#FFFFFF"/>
      <rect x="10" y="10" width="210" height="46" rx="16" fill="#2BA59B"/>
      <rect x="10" y="40" width="210" height="16" fill="#2BA59B"/>
      <rect x="28" y="26" width="64" height="12" rx="6" fill="#FFFFFF" opacity="0.85"/>
    </g>
    <g id="ltr">
      <rect x="30" y="74" width="170" height="76" rx="6" fill="#2BA59B" opacity="0.85"/>
      <path d="M 44 140 L 84 100 L 108 124 L 132 104 L 186 140 Z" fill="#1E2A4A" opacity="0.35"/>
      <circle cx="58" cy="92" r="9" fill="#FFFFFF" opacity="0.7"/>
      <rect x="30" y="170" width="160" height="10" rx="5" fill="#B9B9B9"/>
      <rect x="30" y="194" width="140" height="10" rx="5" fill="#B9B9B9"/>
      <rect x="30" y="218" width="165" height="10" rx="5" fill="#B9B9B9"/>
      <rect x="30" y="242" width="110" height="10" rx="5" fill="#B9B9B9"/>
    </g>
    <g id="rtl">
      <rect x="30" y="74" width="170" height="76" rx="6" fill="#2BA59B" opacity="0.85"/>
      <path d="M 44 140 L 98 104 L 122 124 L 146 100 L 186 140 Z" fill="#1E2A4A" opacity="0.35"/>
      <circle cx="172" cy="92" r="9" fill="#FFFFFF" opacity="0.7"/>
      <rect x="40" y="170" width="160" height="10" rx="5" fill="#B9B9B9"/>
      <rect x="60" y="194" width="140" height="10" rx="5" fill="#B9B9B9"/>
      <rect x="35" y="218" width="165" height="10" rx="5" fill="#B9B9B9"/>
      <rect x="90" y="242" width="110" height="10" rx="5" fill="#B9B9B9"/>
    </g>
  </defs>

  <rect width="1800" height="600" fill="#F4F2EE"/>

  <!-- Name and line -->
  <text x="110" y="300" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="150" font-weight="700" letter-spacing="3" fill="#1E2A4A">AO Quill</text>
  <text x="114" y="380" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#4A5468">One researched article a day, in every language.</text>
  <rect x="114" y="420" width="120" height="8" rx="4" fill="#E8A33D"/>

  <!-- Globe grid -->
  <g fill="none" stroke="#1E2A4A" stroke-width="2" opacity="0.35">
    <circle cx="1150" cy="300" r="220"/>
    <ellipse cx="1150" cy="300" rx="110" ry="220"/>
    <ellipse cx="1150" cy="300" rx="190" ry="220"/>
    <line x1="1150" y1="80" x2="1150" y2="520"/>
    <ellipse cx="1150" cy="300" rx="220" ry="70"/>
    <ellipse cx="1150" cy="300" rx="200" ry="160"/>
    <line x1="930" y1="300" x2="1370" y2="300"/>
  </g>

  <!-- The written line, from the nib to the pages -->
  <path d="M 1086 412 C 1010 470 990 520 1080 520 C 1190 520 1220 440 1300 470 C 1360 492 1380 450 1420 430"
        fill="none" stroke="#E8A33D" stroke-width="9" stroke-linecap="round"/>
  <path d="M 1086 412 C 1010 470 990 520 1080 520 C 1190 520 1220 440 1300 470 C 1360 492 1380 450 1420 430"
        fill="none" stroke="#F6C76E" stroke-width="20" stroke-linecap="round" opacity="0.25"/>

  <!-- Pen: navy barrel, gold nib, pointing down and right -->
  <g transform="translate(1040 300) rotate(-36)">
    <rect x="-56" y="-420" width="112" height="300" rx="10" fill="#1E2A4A"/>
    <rect x="0" y="-420" width="56" height="300" fill="#2B3A60" opacity="0.6"/>
    <g transform="translate(0 0)">
      <use href="#nib" transform="translate(12 10)" fill="#1E2A4A" opacity="0.13"/>
      <use href="#nib" fill="#E8A33D"/>
      <use href="#nib" fill="#C98A2C" clip-path="url(#rh)"/>
      <rect x="-80" y="-128" width="160" height="46" rx="10" fill="#E8A33D"/>
      <rect x="0" y="-128" width="80" height="46" rx="10" fill="#C98A2C"/>
      <circle cx="0" cy="-34" r="19" fill="#F4F2EE"/>
      <rect x="-4" y="-16" width="8" height="118" rx="4" fill="#F4F2EE"/>
    </g>
  </g>

  <!-- Four pages fanned out: the languages; the last one right to left -->
  <g transform="translate(1290 160) rotate(-14)"><use href="#card"/><use href="#ltr"/></g>
  <g transform="translate(1380 150) rotate(-5)"><use href="#card"/><use href="#ltr"/></g>
  <g transform="translate(1465 160) rotate(5)"><use href="#card"/><use href="#ltr"/></g>
  <g transform="translate(1545 185) rotate(14)"><use href="#card"/><use href="#rtl"/></g>
</svg>
