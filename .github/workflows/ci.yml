name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_contracts.py --check
      - run: pip install -e "./worker[dev]"
      - run: pytest worker/tests
      - run: pytest ao-server/checks/tests
        env:
          PYTHONPATH: ao-server/checks
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f wordpress-plugin/tests-docker/docker-compose.yml run --rm phpunit
