# Polls every 15 minutes. The plugin decides whether a run is due, so changing the
# run time in WordPress needs no redeploy. One pod at a time, no volumes, no GPU.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ao-quill-worker
  labels:
    app.kubernetes.io/name: ao-quill-worker
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400  # matches the default run lease of 240 minutes
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ao-quill-worker
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: registry.example.internal/ao-quill-worker:0.1.0
              args: ["run"]
              envFrom:
                - secretRef:
                    name: ao-quill-worker
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
